# Serveur principal d'un serveur de bases (SERVER_ROLE=data, PUBLIC_HOST) : api et fichiers des instances,
# sans interface ni access API (servis par le serveur de contrôle {{CONTROL_URL}}).
# Généré en conf.d/10-main.conf par bin/render-nginx.sh. Le mode d'écoute vient de snippets/listen-main.conf.
server {
    include /etc/nginx/snippets/listen-main.conf;
    server_name _;

    # L'interface (autre origine) appelle /api/<uid>/ en CORS (géré par l'api) et affiche l'aperçu des
    # contenus dans une iframe : pas de X-Frame-Options SAMEORIGIN ici, frame-ancestors limité à l'interface.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self' {{CONTROL_URL}}" always;
    add_header Strict-Transport-Security $hsts_header always;

    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/health.conf;

    # --- instances : /api/<uid>/ et /files/<uid>/ (fragments générés) ---
    include /etc/nginx/conf.d/instances/*.conf;

    location = / {
        default_type text/plain;
        return 200 "Toolso Emailing : serveur de bases. Interface : {{CONTROL_URL}}\n";
    }
    location / {
        return 404;
    }
}
