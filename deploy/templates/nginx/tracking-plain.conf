# Domaines de tracking de l'instance « {{UID}} » (généré par bin/render-nginx.sh, mode sans TLS) :
# tout est proxifié à la racine de api_{{UID}} (/tk, /tkc, /tko, /unsub, /m, /webhooks…).
server {
    listen 80;
    listen [::]:80;
    server_name {{TRACKING_HOSTS_SPACED}};

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/acme.conf;

    client_max_body_size 10m;

    location / {
        set $upstream_tracking_{{UID}} api_{{UID}};
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$upstream_tracking_{{UID}}:4001;
    }
}
