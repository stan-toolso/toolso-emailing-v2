# Domaines de tracking de l'instance « {{UID}} » (généré par bin/render-nginx.sh) :
# tout est proxifié à la racine de api_{{UID}} (/tk, /tkc, /tko, /unsub, /m, /webhooks…).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{TRACKING_HOSTS_SPACED}};

    ssl_certificate     /etc/letsencrypt/live/tracking-{{UID}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracking-{{UID}}/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10m;

    location / {
        set $upstream_tracking_{{UID}} api_{{UID}};
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$upstream_tracking_{{UID}}:4001;
    }
}
