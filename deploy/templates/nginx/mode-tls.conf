# Mode TLS (généré par bin/render-nginx.sh) : 80 sert le défi ACME et redirige vers HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/health.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}
