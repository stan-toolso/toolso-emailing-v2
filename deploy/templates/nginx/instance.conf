# Instance « {{UID}} » (généré par bin/render-nginx.sh) : inclus dans le serveur principal.

# API de l'instance : /api/{{UID}}/… → http://api_{{UID}}:4001/… (préfixe retiré).
# Uploads CSV volumineux (PUT /uploads/:key) et exports : corps jusqu'à 1 Go, 5 min.
location /api/{{UID}}/ {
    client_max_body_size 1g;
    set $upstream_api_{{UID}} api_{{UID}};
    rewrite ^/api/{{UID}}/(.*)$ /$1 break;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://$upstream_api_{{UID}}:4001;
}
location = /api/{{UID}} {
    return 301 /api/{{UID}}/;
}

# Exports de contacts de l'instance (lecture seule, fichiers produits par les workers).
location /files/{{UID}}/ {
    alias /var/lib/toolso-emailing/files/{{UID}}/exports/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
