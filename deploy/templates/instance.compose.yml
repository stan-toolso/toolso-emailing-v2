# Stack de l'instance « {{UID}} » (générée par bin/add-database.sh, ne pas éditer à la main :
# modifier deploy/templates/instance.compose.yml puis relancer bin/add-database.sh {{UID}} …).
# Image unique toolso-emailing-api construite par la stack plateforme (profil build).
#   bin/compose.sh {{UID}} ps | logs -f | restart worker

name: toolso-{{UID}}

networks:
  toolso:
    external: true

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-instance: &instance
  image: toolso-emailing-api:latest
  restart: unless-stopped
  networks: [toolso]
  env_file:
    - ./.env
  volumes:
    - {{DATA_DIR}}/files/{{UID}}:/data/files
  logging: *logging
  stop_grace_period: 60s

services:
  api:
    <<: *instance
    container_name: api_{{UID}}
    environment:
      ROLE: api
      PORT: "4001"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: ${API_MEM_LIMIT:-384m}

  worker:
    <<: *instance
    container_name: worker_{{UID}}
    environment:
      ROLE: worker
      WORKER_QUEUE: default
      NODE_ENV: production
    mem_limit: ${WORKER_MEM_LIMIT:-512m}

  worker_huge:
    <<: *instance
    container_name: worker_huge_{{UID}}
    environment:
      ROLE: worker
      WORKER_QUEUE: huge
      WORKER_CONCURRENCY: "2"
      NODE_ENV: production
    mem_limit: ${WORKER_HUGE_MEM_LIMIT:-1g}

  scheduler:
    <<: *instance
    container_name: scheduler_{{UID}}
    environment:
      ROLE: scheduler
      NODE_ENV: production
    mem_limit: ${SCHEDULER_MEM_LIMIT:-384m}
