# Serveur principal (PUBLIC_HOST) : UI statique, access API, api et fichiers des instances.
# Le mode d'écoute (80 ou 443+TLS) vient de snippets/listen-main.conf (bin/render-nginx.sh).
server {
    include /etc/nginx/snippets/listen-main.conf;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/health.conf;

    # --- access API (authentification, entreprises, bases) ---
    # (proxy_pass par variable : nginx démarre et se recharge même si access est arrêté)
    location = /access/graphql {
        client_max_body_size 2m;
        set $upstream_access access;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$upstream_access:4000/graphql;
    }
    location = /access/health {
        access_log off;
        set $upstream_access access;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$upstream_access:4000/health;
    }

    # --- instances : /api/<uid>/ et /files/<uid>/ (fragments générés) ---
    include /etc/nginx/conf.d/instances/*.conf;

    # --- UI statique (CRA, HashRouter) ---
    # Bundles empreints : cache long.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
