# nginx de l'instance autonome Toolso Emailing (monté par-dessus l'image apps/ui).
# UI statique + reverse proxy vers access et les api d'instance. Les fragments par
# instance (conf.d/instances, conf.d/tracking) et le mode TLS (conf.d/05-mode.conf,
# snippets/listen-main.conf) sont générés par bin/render-nginx.sh.

user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    # Résolution des conteneurs d'instance (api_<uid>) par le DNS interne de Docker :
    # avec un proxy_pass par variable, nginx démarre même si une instance est arrêtée.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 10m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/xml+rss image/svg+xml font/woff2 application/manifest+json;

    # HSTS seulement en HTTPS (valeur vide = en-tête non émis).
    map $scheme $hsts_header {
        https   "max-age=31536000";
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/tracking/*.conf;
}
