# Configuration nginx minimale pour servir le build CRA de l'UI (HashRouter : tout passe par /index.html).
# La stack de déploiement remplace ce fichier par sa configuration complète (TLS, /access, /api/<uid>, /files/<uid>).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    # Bundles CRA : nom de fichier haché, cache long.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html et manifest : jamais mis en cache (ils référencent les bundles hachés).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
